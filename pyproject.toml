[project]
name = "knowledge-base"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    # 以下第三方库当前虚拟环境尚未安装，需手动执行 pip install 补齐。
    "SQLAlchemy>=2.0.36",    # ORM：10 张业务表的声明式模型
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "langgraph>=1.2.11",
    "minio>=7.2.0",          # 对象存储：知识单元原始文件
    "openai>=3.14.0",
    "pydantic>=2.13.5",
    "PyJWT>=2.9.0",          # 认证鉴权：JWT 令牌签发与校验
    "pymilvus>=2.4.0",       # 向量库：kb_unit_chunks 集合结构定义
    "PyMySQL>=1.1.0",        # MySQL 驱动（SQLAlchemy 连接串 mysql+pymysql）
    "python-multipart>=0.0.9",  # FastAPI 接收 multipart/form-data（知识导入）
    "redis>=5.0.0",          # 缓存：FAQ 加速 / 看板实时计数 / 会话
    "pypdf>=4.0.0",          # 文档解析：PDF
    "python-docx>=1.1.0",    # 文档解析：Word(.docx)
    "uvicorn>=0.53.0",
]
